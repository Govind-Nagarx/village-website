<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Village Phundiya — Teachers Portfolio</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --green: #2e7d32;
      --bg: #f5fdf5;
      --card: #ffffff;
      --muted: #6b6b6b;
      --shadow: rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      font-family: Poppins, Arial;
      background: var(--bg);
      margin: 0;
      color: #123;
    }

    header {
      background: linear-gradient(90deg, var(--green), #170663);
      color: white;
      padding: 36px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: clamp(20px, 3vw, 32px);
    }

    .container {
      max-width: 1100px;
      margin: 28px auto;
      padding: 0 18px;
    }

    /* ---------- CARDS ---------- */
    .teachers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 4px 15px var(--shadow);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(25px);
      animation: fadeInUp 0.8s ease forwards;
    }

    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 12px;
      border: 4px solid #e1f2e1;
    }

    h3 { color: var(--green); margin: 6px 0; }
    p.role { color: var(--muted); font-weight: 600; }
    p.contact { margin: 8px 0; }

    .btn {
      display: inline-block;
      background: var(--green);
      color: white;
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      margin-top: 8px;
    }

    /* ---------- DESKTOP HOVER ONLY ---------- */
    @media (hover: hover) and (pointer: fine) {
      .card {
        transition: 0.4s;
      }

      .card:hover {
        transform: translateY(-14px) scale(1.07);
        box-shadow: 0 20px 45px rgba(0,0,0,0.22);
      }

      .card:hover .avatar {
        transform: scale(1.12) rotate(2deg);
        border-color: var(--green);
      }
    }

    /* ---------- MODAL ---------- */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: 0.4s;
      z-index: 10;
    }

    .modal.open {
      opacity: 1;
      pointer-events: auto;
    }

    .panel {
      width: 100%;
      max-width: 820px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 25px 60px rgba(0,0,0,0.3);
      transform: translateY(60px) scale(0.9);
      opacity: 0;
      transition: 0.4s;
      position: relative;
    }

    .modal.open .panel {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .panel-content {
      padding: 24px;
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 22px;
    }

    .panel-left {
      text-align: center;
      border-right: 1px solid #e8efe8;
    }

    .panel-left img {
      width: 180px;
      height: 180px;
      border-radius: 16px;
      object-fit: cover;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .skill {
      padding: 7px 14px;
      background: #e9f8ec;
      border-radius: 999px;
      color: var(--green);
      font-weight: 600;
    }

    .close-btn {
      position: absolute;
      top: 14px;
      right: 18px;
      background: white;
      border: none;
      border-radius: 50%;
      padding: 6px 10px;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,0.25);
    }

    footer {
      text-align: center;
      background: linear-gradient(to right,#2e7d32,#170663);
      color: white;
      padding: 18px;
      margin-top: 40px;
      
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---------- MOBILE FIX ---------- */
  /*  @media (max-width: 786px) {

      .teachers {
        grid-template-columns: 1fr;
      }

      .card {
        width: 100%;
        transform: none !important;
      }

      .panel {
        max-width: 100%;
        height: 100%;
        border-radius: 0;
      }

      .panel-content {
        grid-template-columns: 1fr;
        max-height: 90vh;
        overflow-y: auto;
      }

      .panel-left {
        border-right: none;
      }

      .panel-left img {
        width: 140px;
        height: 140px;
      }
    }*/





    /* ---------- BETTER MOBILE PANEL ---------- */
@media (max-width: 786px) {

  .modal {
  align-items: flex-end;
  padding-bottom: 24px;   /* 👈 bottom se upar gap */
}


  .panel {
    width: 100%;
    max-height: 82vh;        /* full nahi – thoda chhota */
    border-radius: 20px 20px 0 0;
    transform: translateY(100%);
    transition: 0.35s ease;
  }

  .modal.open .panel {
    transform: translateY(0);
  }

  .panel-content {
    grid-template-columns: 1fr;
    padding: 16px;
    gap: 14px;
    overflow-y: auto;
  }

  .panel-left {
    border-right: none;
    border-bottom: 1px solid #eee;
    padding-bottom: 12px;
  }

  .panel-left img {
    width: 110px;
    height: 110px;
    border-radius: 14px;
  }

  .panel-left h3 {
    font-size: 16px;
  }

  .panel-left p {
    font-size: 14px;
  }

  .panel-content h2,
  .panel-content h4 {
    margin: 10px 0 4px;
    font-size: 15px;
  }

  .panel-content p {
    font-size: 14px;
    line-height: 1.5;
  }

  .skill {
    font-size: 12px;
    padding: 5px 12px;
  }

  .close-btn {
    top: 10px;
    right: 12px;
    font-size: 16px;
  }
}

  </style>
</head>

<body>

<header>
  <h1>Village Phundiya — Teachers</h1>
  <p>Government Secondary School Teachers Portfolio</p>
</header>

<main class="container">
  <div class="teachers">

    <article class="card" data-id="Mahesh">
      <img class="avatar" src="https://via.placeholder.com/300" />
      <h3>Mr. Mahesh Kushwaha</h3>
      <p class="role">Mathematics Teacher</p>
      <p class="contact">📞 +91 90011 22334</p>
      <span class="btn">View Profile</span>
    </article>

    <article class="card" data-id="Jagdish">
      <img class="avatar" src="https://via.placeholder.com/300" />
      <h3>Mr. Jagdish Prashad Sharma</h3>
      <p class="role">Sanskrit Teacher</p>
      <p class="contact">📞 +91 98222 44556</p>
      <span class="btn">View Profile</span>
    </article>

  </div>
</main>

<footer>© Village Phundiya</footer>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="panel">
    <button class="close-btn" id="close">✕</button>
    <div class="panel-content">
      <div class="panel-left">
        <img id="m-img">
        <h3 id="m-name"></h3>
        <p id="m-role"></p>
        <p id="m-contact"></p>
      </div>
      <div>
        <h2>Profile</h2>
        <p id="m-bio"></p>

        <h4>Experience</h4>
        <p id="m-exp"></p>

        <h4>Education</h4>
        <p id="m-edu"></p>

        <h4>Skills</h4>
        <div class="skills" id="m-skills"></div>
      </div>
    </div>
  </div>
</div>

<script>
const data = {
  Mahesh: {
    name: "Mr. Mahesh Kushwaha",
    role: "Mathematics Teacher",
    contact: "+91 90011 22334",
    bio: "Experienced mathematics teacher focused on clarity.",
    exp: "12 Years",
    edu: "M.Sc Mathematics, B.Ed",
    skills: ["Algebra","Geometry","Trigonometry"],
    img: "https://via.placeholder.com/400"
  },
  Jagdish: {
    name: "Mr. Jagdish Prashad Sharma",
    role: "Sanskrit Teacher",
    contact: "+91 98222 44556",
    bio: "Dedicated Sanskrit teacher with traditional values.",
    exp: "18 Years",
    edu: "M.A Sanskrit",
    skills: ["Grammar","Reading","Writing"],
    img: "https://via.placeholder.com/400"
  }
};

const modal = document.getElementById("modal");

document.querySelectorAll(".card").forEach(c=>{
  c.onclick=()=>{
    const t=data[c.dataset.id];
    document.getElementById("m-img").src=t.img;
    document.getElementById("m-name").innerText=t.name;
    document.getElementById("m-role").innerText=t.role;
    document.getElementById("m-contact").innerText=t.contact;
    document.getElementById("m-bio").innerText=t.bio;
    document.getElementById("m-exp").innerText=t.exp;
    document.getElementById("m-edu").innerText=t.edu;

    const s=document.getElementById("m-skills");
    s.innerHTML="";
    t.skills.forEach(k=>{
      const span=document.createElement("span");
      span.className="skill";
      span.innerText=k;
      s.appendChild(span);
    });

    modal.classList.add("open");
    document.body.style.overflow="hidden";
  };
});

document.getElementById("close").onclick=()=>{
  modal.classList.remove("open");
  document.body.style.overflow="auto";
};

modal.onclick=e=>{
  if(e.target===modal){
    modal.classList.remove("open");
    document.body.style.overflow="auto";
  }
};
</script>

</body>
</html>
