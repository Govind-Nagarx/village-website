<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>School Virtual Tour</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
*{box-sizing:border-box}
body{
 margin:0;overflow:hidden;
 background:#000;font-family:Arial;
 touch-action:none;
}

/* INFO */
#info{
 position:fixed;top:8px;left:8px;
 background:rgba(0,0,0,.6);
 color:#fff;padding:6px 10px;
 font-size:12px;border-radius:6px;z-index:10;
}

/* MINI MAP */
#minimap{
 position:fixed;top:8px;right:8px;
 background:#fff;padding:6px;
 font-size:11px;border-radius:8px;z-index:10;
}

/* LOADER */
#loader{
 position:fixed;inset:0;
 background:#000;color:#fff;
 display:flex;align-items:center;
 justify-content:center;
 z-index:50;font-size:18px;
}

/* BOTTOM NAV */
#bottomNav{
 position:fixed;bottom:0;left:0;
 width:100%;height:64px;
 background:#fff;
 display:flex;align-items:center;
 border-top:1px solid #ddd;z-index:20;
}
.nav-item{
 flex:1;text-align:center;
 font-size:11px;color:#666;
}
.nav-item span{display:block;font-size:20px}
.nav-item.active{color:#0b57d0;font-weight:bold}

/* HOTSPOT */
.hotspot{
 position:absolute;width:24px;height:24px;
 background:#0b57d0;border-radius:50%;
 box-shadow:0 0 12px #0b57d0;
 transform:translate(-50%,-50%);
 z-index:15;
}
.hotspot::after{
 content:"";position:absolute;
 width:100%;height:100%;
 border-radius:50%;
 background:rgba(11,87,208,.5);
 animation:pulse 1.5s infinite;
}
@keyframes pulse{
 0%{transform:scale(1);opacity:1}
 100%{transform:scale(2);opacity:0}
}

@media(max-width:480px){
 #bottomNav{height:56px}
 .nav-item span{font-size:18px}
}
</style>
</head>

<body>

<div id="loader">Loading Tour...</div>

<div id="info">🏫 School Tour<br>Touch / Mouse Drag</div>
<div id="minimap"><b>Floor:</b> Ground</div>

<!-- HOTSPOT -->
<div class="hotspot" style="top:50%;left:50%" onclick="goScene(1)"></div>

<!-- BOTTOM NAV -->
<div id="bottomNav">
 <div class="nav-item active" onclick="goScene(0,this)">
  <span>🏫</span>Ground
 </div>
 <div class="nav-item" onclick="goScene(1,this)">
  <span>🏫</span>Class
 </div>
 <div class="nav-item" onclick="goScene(2,this)">
  <span>🏢</span>Office
 </div>
 <div class="nav-item" onclick="toggleAudio()">
  <span>🔊</span>Audio
 </div>
 <div class="nav-item" onclick="toggleWalk()">
  <span>👣</span>Walk
 </div>
</div>

<audio id="bgAudio" loop>
 <source src="audio/school.mp3">
</audio>

<script src="https://cdn.jsdelivr.net/npm/three@0.152/build/three.min.js"></script>

<script>
const scenes=[
 {img:"image/school1.jpg",name:"Ground Floor"},
 {img:"image/school2.jpg",name:"Class Room"},
 {img:"image/school3.jpg",name:"Office"}
];

let lon=0,lat=0,autoWalk=false;
const loader=document.getElementById("loader");

/* THREE */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,1,1100);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

const geo=new THREE.SphereGeometry(500,48,32);
geo.scale(-1,1,1);

const textureLoader=new THREE.TextureLoader();
const mat=new THREE.MeshBasicMaterial({
 map:textureLoader.load(scenes[0].img,()=>loader.style.display="none")
});
scene.add(new THREE.Mesh(geo,mat));

/* SCENE CHANGE */
function goScene(i,el){
 loader.style.display="flex";
 textureLoader.load(scenes[i].img,t=>{
  mat.map=t;mat.needsUpdate=true;
  document.getElementById("minimap").innerHTML=
   "<b>Floor:</b> "+scenes[i].name;
  loader.style.display="none";
 });
 document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
 if(el)el.classList.add("active");
}

/* AUDIO */
const audio=document.getElementById("bgAudio");
function toggleAudio(){audio.paused?audio.play():audio.pause();}

/* WALK */
function toggleWalk(){autoWalk=!autoWalk}

/* TOUCH + MOUSE */
let down=false,x=0,y=0;
addEventListener("mousedown",e=>{down=true;x=e.clientX;y=e.clientY});
addEventListener("mousemove",e=>{
 if(!down)return;
 lon+=(x-e.clientX)*0.1;
 lat+=(e.clientY-y)*0.1;
 x=e.clientX;y=e.clientY;
});
addEventListener("mouseup",()=>down=false);

addEventListener("touchstart",e=>{
 down=true;x=e.touches[0].clientX;y=e.touches[0].clientY;
});
addEventListener("touchmove",e=>{
 if(!down)return;
 lon+=(x-e.touches[0].clientX)*0.1;
 lat+=(e.touches[0].clientY-y)*0.1;
 x=e.touches[0].clientX;y=e.touches[0].clientY;
});
addEventListener("touchend",()=>down=false);

/* GYROSCOPE */
if(window.DeviceOrientationEvent){
 window.addEventListener("deviceorientation",e=>{
  lon=e.alpha||lon;
  lat=(e.beta||90)-90;
 });
}

/* LOOP */
function animate(){
 requestAnimationFrame(animate);
 if(autoWalk)lon+=0.05;
 lat=Math.max(-80,Math.min(80,lat));
 const phi=THREE.MathUtils.degToRad(90-lat);
 const theta=THREE.MathUtils.degToRad(lon);
 camera.lookAt(
  500*Math.sin(phi)*Math.cos(theta),
  500*Math.cos(phi),
  500*Math.sin(phi)*Math.sin(theta)
 );
 renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
